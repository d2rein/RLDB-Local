name: Deploy Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Build seed files
        working-directory: .
        env:
          NRL_DATA_ROOT_OVERRIDE: ${{ github.workspace }}/docs/NRL-Data-main_duplicate/data/NRL
          NRLW_DATA_ROOT_OVERRIDE: ${{ github.workspace }}/docs/NRL-Data-main_duplicate/data/NRLW
        run: |
          npm run seed:reference
          npm run seed:core
          npm run seed:core-sql
          npm run seed:legacy-sql
          npm run seed:player-stats-sql
          npm run seed:match-summaries-sql

      - name: Apply remote D1 seed
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_BINDING: rl_stats_db
        run: node ./scripts/apply-remote-d1.mjs

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: .
